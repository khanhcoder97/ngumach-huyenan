name: godot-client-core

on:
  push:
    branches:
      - 'opencode/opc-15-godot-client-core-20261103'
    paths:
      - 'Shared/**'
      - 'Client/Assets/Scripts/Online/**'
      - 'Server/Health/**'
      - '.github/workflows/godot-client-core.yml'
  pull_request:
    branches:
      - 'opencode/opc-14-ui-runtime-hardening-20261101'
      - 'opencode/opc-15-godot-client-core-20261103'
    paths:
      - 'Shared/**'
      - 'Client/Assets/Scripts/Online/**'
      - 'Server/Health/**'
      - '.github/workflows/godot-client-core.yml'

jobs:
  shared-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore + build Shared/ClientCore
        run: dotnet build Shared/ClientCore/ClientCore.csproj -c Release --nologo
      - name: Build sample against the real portable API
        run: dotnet build Shared/ClientCore.Sample/ClientCore.Sample.csproj -c Release --nologo
      - name: Test Shared/ClientCore.Tests (TRX)
        run: |
          dotnet test Shared/ClientCore.Tests/ClientCore.Tests.csproj -c Release --nologo \
            --logger "trx;LogFileName=clientcore.trx" \
            --results-directory TestResults/clientcore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clientcore-test-results
          path: TestResults/clientcore/
          if-no-files-found: warn

  shared-http-runner:
    runs-on: ubuntu-latest
    needs: shared-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Run portable HTTP runner (private server, mandatory)
        run: python3 Shared/ClientCore.HttpRunner/run_http.py
      - name: Enforce positive assertion count
        if: always()
        run: |
          test -s TestResults/clientcore-http/assertions.txt
          count="$(tr -d '[:space:]' < TestResults/clientcore-http/assertions.txt)"
          test -n "$count"
          test "$count" -gt 0
          echo "HTTP assertions: $count"
      - name: Upload HTTP artifacts (raw logs + assertion count)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clientcore-http-results
          path: TestResults/clientcore-http/
          if-no-files-found: warn
