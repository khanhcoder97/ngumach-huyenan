name: Codex visual reboot
on:
  pull_request:
    paths:
      - 'ClientGodot/**'
      - 'Art_Source/Visual_Reboot_20261104/**'
      - 'Tools/ArtProduction/**'
      - 'Tools/Coordination/**'
      - 'Implementation/Coordination/**'
      - '.github/workflows/visual-reboot.yml'
permissions:
  contents: read
jobs:
  build-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch only the new art batch
        run: git lfs pull --include="Art_Source/Visual_Reboot_20261104/**,ClientGodot/assets/reboot/**" --exclude=""
      - run: python -m pip install Pillow==11.3.0
      - run: python Tools/ArtProduction/inspect_reboot.py
      - run: python -m unittest discover -s Tools/Coordination -p 'test_*.py' -v
      - run: dotnet restore ClientGodot/VisualReboot.csproj --locked-mode
      - run: dotnet build ClientGodot/VisualReboot.csproj --no-restore --nologo
