name: content-pipeline-validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run content pipeline tests
        run: python Implementation/Tools/ContentPipeline/tests/test_content_pipeline.py
      - name: Rebuild Bến Mưa candidates byte-for-byte (fails if stale)
        run: python Implementation/Tools/ContentPipeline/content_pipeline.py build --check
