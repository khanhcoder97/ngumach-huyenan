name: producer-design-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard-design-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python Implementation/Tools/validate_guard_precision.py
