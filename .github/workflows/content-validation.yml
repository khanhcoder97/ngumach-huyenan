name: content-validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate production content
        run: python Implementation/Tools/validate_content.py
      - name: Validate map topology bundles
        run: python Implementation/Tools/validate_topology.py
      - name: Validate narrative and cinema handoff
        run: python Implementation/Tools/validate_narrative.py
      - name: Rebuild world runtime content and verify no drift
        run: |
          python Implementation/Tools/build_world_records.py
          python Implementation/Tools/build_world_entities.py
          python Implementation/Tools/build_combat_mob_stats.py
          git diff --exit-code -- \
            Implementation/Content/Runtime/world_records.json \
            Implementation/Content/Runtime/world_entities_bm.json \
            Implementation/Content/Runtime/combat_mob_stats_v1.json
