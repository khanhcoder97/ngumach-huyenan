name: asset-handoff-validation

# Runs when art, the delivery manifest or the handoff tooling changes.
# No Unity, no .NET and no third-party Python packages are installed.
#
# The full OPC-05..10 pipeline (including pack -> verify -> unpack -> verify)
# is executed by Tools/AssetPack/run_all_checks.py, so the same command can be
# reproduced locally from a clean clone.

on:
  pull_request:
    paths:
      - "Client/Assets/Art/**"
      - "Client/Assets/ArtManifests/**"
      - "Client/Assets/UI/Art/**"
      - "Client/Assets/Tilemaps/**"
      - "Client/Assets/VFX/**"
      - "Client/Assets/Animation/**"
      - "Implementation/Asset_Handoff/**"
      - "Tools/AssetPack/**"
      - "Tools/AssetPreview/**"
      - ".github/workflows/asset-handoff-validation.yml"
  push:
    branches: [main]
    paths:
      - "Client/Assets/Art/**"
      - "Client/Assets/ArtManifests/**"
      - "Client/Assets/UI/Art/**"
      - "Client/Assets/Tilemaps/**"
      - "Client/Assets/VFX/**"
      - "Client/Assets/Animation/**"
      - "Implementation/Asset_Handoff/**"
      - "Tools/AssetPack/**"
      - "Tools/AssetPreview/**"
      - ".github/workflows/asset-handoff-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Git LFS content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm LFS objects were fetched
        run: |
          git lfs version
          echo "tracked LFS files: $(git lfs ls-files | wc -l)"

      - name: Validator unit tests
        run: python -m unittest discover -s Implementation/Asset_Handoff/tests -v

      - name: Self check on the shipped example manifest
        run: >-
          python Implementation/Asset_Handoff/validate_asset_delivery.py
          --skip-file-checks
          --manifest Implementation/Asset_Handoff/muse_delivery_manifest.example.json

      - name: Validate v2 manifest fixtures
        run: |
          set -eu
          for fixture in Implementation/Asset_Handoff/fixtures/manifest_v2/valid_*.json; do
            echo "validating ${fixture}"
            python Implementation/Asset_Handoff/validate_asset_delivery.py \
              --manifest "${fixture}" \
              --skip-file-checks
          done

      - name: Migration dry-run on the legacy manifest
        run: python Implementation/Asset_Handoff/migrate_manifest_v2.py --quiet

      - name: Collect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ -n "${BASE_SHA:-}" ]; then
            git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" > changed.txt
          elif git rev-parse --verify -q "${GITHUB_SHA}~1" >/dev/null; then
            git diff --name-only "${GITHUB_SHA}~1" "${GITHUB_SHA}" > changed.txt
          else
            git show --name-only --pretty=format: "${GITHUB_SHA}" > changed.txt
          fi
          echo "changed paths:"; sed 's/^/  /' changed.txt

      - name: Validate the delivered asset manifest
        run: >-
          python Implementation/Asset_Handoff/validate_asset_delivery.py
          --changed-files changed.txt
          --allow-missing-manifest
          --report asset-handoff-report.txt

      - name: Full pipeline (tests, audit x2, pack x2, unpack/verify, gates, preview)
        run: >-
          python Tools/AssetPack/run_all_checks.py
          --evidence-dir Tools/AssetPack/ci_evidence

      - name: Confirm pack and unpack evidence exist
        run: |
          set -eu
          test -f Tools/AssetPack/ci_evidence/bundle1/bundle-manifest.json
          test -f Tools/AssetPack/ci_evidence/bundle2/bundle-manifest.json
          test -f Tools/AssetPack/ci_evidence/unpacked/bundle-manifest.json
          test -f Tools/AssetPack/ci_evidence/unpacked-verify.json
          cmp Tools/AssetPack/ci_evidence/bundle1/bundle-manifest.json \
              Tools/AssetPack/ci_evidence/unpacked/bundle-manifest.json
          echo "pack -> unpack manifests are byte-identical"

      - name: Upload findings and bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-handoff-report
          path: |
            asset-handoff-report.txt
            changed.txt
            Tools/AssetPack/ci_evidence/**
          if-no-files-found: warn
