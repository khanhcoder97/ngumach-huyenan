  <!-- Details panel -->
  <rect x="1105" y="185" width="440" height="745" rx="16" fill="url(#panel)" stroke="#927345" stroke-opacity=".7"/>
  <text x="1140" y="226" fill="#e7d6aa" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">DESIGN LANGUAGE</text>
  <text x="1140" y="270" fill="#f1e7d0" font-family="Georgia,serif" font-size="23">A quiet guardian</text>
  <text x="1140" y="299" fill="#b5c0c1" font-family="Arial,sans-serif" font-size="14">Composed, alert, never ostentatious.</text>
  <path d="M1140 321H1510" stroke="#677781"/>
  <text x="1140" y="358" fill="#dfc88e" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SILHOUETTE &amp; MATERIAL</text>
  <text x="1140" y="389" fill="#d7ded9" font-family="Arial,sans-serif" font-size="14">• Crossed-hem robe, long split panels</text>
  <text x="1140" y="415" fill="#d7ded9" font-family="Arial,sans-serif" font-size="14">• Upright stance; lead hand near sword hilt</text>
  <text x="1140" y="441" fill="#d7ded9" font-family="Arial,sans-serif" font-size="14">• Hex clasp is the single signature motif</text>
  <text x="1140" y="467" fill="#d7ded9" font-family="Arial,sans-serif" font-size="14">• Layered cloth; restrained metal accents</text>
  <path d="M1140 490H1510" stroke="#677781"/>
  <text x="1140" y="526" fill="#dfc88e" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PALETTE PROPOSAL</text>
  <rect x="1140" y="547" width="48" height="32" rx="6" fill="#d5d0c2"/><text x="1198" y="568" fill="#d7ded9" font-family="Arial,sans-serif" font-size="13">Mist-silver robe · #D5D0C2</text>
  <rect x="1140" y="589" width="48" height="32" rx="6" fill="#53646A"/><text x="1198" y="610" fill="#d7ded9" font-family="Arial,sans-serif" font-size="13">Deep teal shadow · #53646A</text>
  <rect x="1140" y="631" width="48" height="32" rx="6" fill="#B68C4C"/><text x="1198" y="652" fill="#d7ded9" font-family="Arial,sans-serif" font-size="13">Muted brass · #B68C4C</text>
  <rect x="1140" y="673" width="48" height="32" rx="6" fill="#202C34"/><text x="1198" y="694" fill="#d7ded9" font-family="Arial,sans-serif" font-size="13">Ink charcoal · #202C34</text>
  <path d="M1140 725H1510" stroke="#677781"/>
  <text x="1140" y="761" fill="#dfc88e" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ANIMATION / VFX CUES</text>
  <text x="1140" y="791" fill="#d7ded9" font-family="Arial,sans-serif" font-size="13">Guard: 0.4s; silver cue, gold hex on block.</text>
  <text x="1140" y="816" fill="#d7ded9" font-family="Arial,sans-serif" font-size="13">Dash: 0.15s prep · 0.20s dash · 0.24s recovery.</text>
  <text x="1140" y="841" fill="#d7ded9" font-family="Arial,sans-serif" font-size="13">Sword arcs stay readable; VFX never hides tells.</text>
  <text x="1140" y="887" fill="#c39a5c" font-family="Arial,sans-serif" font-size="11" letter-spacing="1">REVIEW BEFORE MODELING / RIGGING / ATLAS</text>
  <text x="70" y="970" fill="#829197" font-family="Arial,sans-serif" font-size="11" letter-spacing="1">DESIGN STUDY ONLY · PROPORTIONS, FACE, HAIR, CLOTHING DETAILS AND PALETTE REQUIRE ART-DIRECTION APPROVAL.</text>
</svg>
