<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Minh Kiếm — visual concept proposal</title>
  <desc id="desc">High definition 2D character design proposal showing front, side and back views, palette and design notes. Not approved production art.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#111a25"/><stop offset="1" stop-color="#202c37"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#263541"/><stop offset="1" stop-color="#18232e"/></linearGradient>
    <linearGradient id="robe" x2="1" y2="1"><stop stop-color="#e4dfcf"/><stop offset=".45" stop-color="#c7c3b8"/><stop offset="1" stop-color="#9ea9a9"/></linearGradient>
    <linearGradient id="robeShade" x2="1" y2="0"><stop stop-color="#89989b"/><stop offset=".55" stop-color="#c3c5bb"/><stop offset="1" stop-color="#e5dfce"/></linearGradient>
