    <pattern id="stars" width="110" height="110" patternUnits="userSpaceOnUse"><circle cx="8" cy="23" r="1.3" fill="#f2ddb0" opacity=".32"/><circle cx="67" cy="82" r="1" fill="#9bbce8" opacity=".28"/><path d="M92 15v7m-3.5-3.5h7" stroke="#e7d397" stroke-opacity=".22"/></pattern>
    <g id="sigil"><path d="M0-22 19-11 19 11 0 22-19 11-19-11Z" fill="#102e68" stroke="url(#gold)" stroke-width="4"/><path d="M0-12 10-6 10 6 0 12-10 6-10-6Z" fill="none" stroke="#fff1ae" stroke-width="2"/><circle r="3.5" fill="#f6cf66"/></g>
  </defs>
