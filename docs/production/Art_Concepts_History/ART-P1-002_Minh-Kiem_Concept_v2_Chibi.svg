<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Minh Kiếm — chibi HD character redesign proposal</title>
  <desc id="desc">A smooth high-definition vector character sheet inspired by chibi knight proportions, with front, side and back views. Original design proposal, not approved production art.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#111b2b"/><stop offset="1" stop-color="#25334a"/></linearGradient>
    <linearGradient id="plate" x2=".9" y2="1"><stop stop-color="#fff8df"/><stop offset=".32" stop-color="#c9d5dc"/><stop offset=".7" stop-color="#788c9f"/><stop offset="1" stop-color="#e1e6df"/></linearGradient>
    <linearGradient id="blue" x2=".9" y2="1"><stop stop-color="#3974ce"/><stop offset=".5" stop-color="#17418d"/><stop offset="1" stop-color="#0b2356"/></linearGradient>
    <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff0a1"/><stop offset=".45" stop-color="#e7b844"/><stop offset="1" stop-color="#98601a"/></linearGradient>
    <linearGradient id="hair" x2=".7" y2="1"><stop stop-color="#c27b43"/><stop offset=".5" stop-color="#794324"/><stop offset="1" stop-color="#3e2a25"/></linearGradient>
    <linearGradient id="skin" x2="0" y2="1"><stop stop-color="#ffe1bc"/><stop offset="1" stop-color="#d99b70"/></linearGradient>
    <linearGradient id="sword" x2="1" y2="0"><stop stop-color="#8295a8"/><stop offset=".48" stop-color="#fffef5"/><stop offset="1" stop-color="#8da3b6"/></linearGradient>
