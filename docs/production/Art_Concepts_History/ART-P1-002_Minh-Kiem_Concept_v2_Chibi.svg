  <!-- Notes -->
  <rect x="1130" y="180" width="420" height="758" rx="20" fill="#172439" fill-opacity=".92" stroke="#9a783b" stroke-opacity=".78"/>
  <text x="1165" y="223" fill="#ecd89f" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">THIẾT KẾ NHẬN DIỆN</text>
  <text x="1165" y="270" fill="#f2e7cf" font-family="Georgia,serif" font-size="26">Kiếm sĩ hộ ấn</text>
  <text x="1165" y="300" fill="#b9c9dd" font-family="Arial,sans-serif" font-size="14">Nhỏ nhắn, lanh lợi; bình tĩnh khi giao chiến.</text>
  <path d="M1165 324H1515" stroke="#687b90"/>
  <text x="1165" y="361" fill="#e2c779" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ĐIỂM GIỮ LẠI</text>
  <text x="1165" y="394" fill="#d9e1e8" font-family="Arial,sans-serif" font-size="14">• Giáp bạc, đường viền đồng vàng</text>
  <text x="1165" y="421" fill="#d9e1e8" font-family="Arial,sans-serif" font-size="14">• Áo choàng xanh lam, phù hiệu lục giác</text>
  <text x="1165" y="448" fill="#d9e1e8" font-family="Arial,sans-serif" font-size="14">• Tóc nâu hạt dẻ, gương mặt trẻ trung</text>
  <text x="1165" y="475" fill="#d9e1e8" font-family="Arial,sans-serif" font-size="14">• Kiếm thẳng nhỏ, đọc rõ ở silhouette</text>
  <path d="M1165 498H1515" stroke="#687b90"/>
  <text x="1165" y="535" fill="#e2c779" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TỈ LỆ &amp; CHẤT LIỆU</text>
  <text x="1165" y="568" fill="#d9e1e8" font-family="Arial,sans-serif" font-size="14">Đầu khoảng 40% chiều cao nhân vật.</text>
  <text x="1165" y="595" fill="#d9e1e8" font-family="Arial,sans-serif" font-size="14">Thân gọn, tay/chân ngắn; khớp bo mềm.</text>
  <text x="1165" y="622" fill="#d9e1e8" font-family="Arial,sans-serif" font-size="14">Bề mặt vẽ tay HD, highlight mượt;</text>
  <text x="1165" y="646" fill="#d9e1e8" font-family="Arial,sans-serif" font-size="14">không pixel grid hay viền răng cưa.</text>
  <path d="M1165 671H1515" stroke="#687b90"/>
  <text x="1165" y="708" fill="#e2c779" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CẦN ĐỒNG BỘ TRƯỚC RIG</text>
  <text x="1165" y="741" fill="#d9e1e8" font-family="Arial,sans-serif" font-size="14">Tỷ lệ mới làm khác tỉ lệ hero 5 WU</text>
  <text x="1165" y="766" fill="#d9e1e8" font-family="Arial,sans-serif" font-size="14">trong Art Bible. Chốt lại scale rig,</text>
  <text x="1165" y="791" fill="#d9e1e8" font-family="Arial,sans-serif" font-size="14">camera và collision trong gameplay.</text>
  <rect x="1165" y="825" width="347" height="59" rx="10" fill="#5f3928" stroke="#d0a05a"/>
  <text x="1182" y="850" fill="#fff0d7" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">CONCEPT ONLY · CHƯA DUYỆT</text>
  <text x="1182" y="870" fill="#e5c9a7" font-family="Arial,sans-serif" font-size="11">Không thay thế atlas / rig / sprite runtime.</text>
  <text x="67" y="973" fill="#9caec1" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.2">STYLE REFERENCE: CHIBI ARMORED SWORDSMAN · ORIGINAL LẠC CHÂU DESIGN · NO KPAH ASSET REUSE · NO PIXEL ART</text>
</svg>
